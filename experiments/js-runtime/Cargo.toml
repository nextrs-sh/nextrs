# Standalone crate: excluded from the main workspace so that the core NextRS
# crates build and test without downloading/linking V8 (~100 MB static lib).
[package]
name = "nextrs-js-runtime-experiment"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "js-experiment"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
deno_core = "0.413"
rquickjs = { version = "0.14", features = ["futures", "loader", "macro"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }

[workspace]
