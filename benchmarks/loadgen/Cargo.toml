[package]
name = "nextrs-loadgen"
version = "0.0.0"
edition = "2024"
publish = false
description = "HTTP/1.1 load generator for the NextRS benchmarks: closed-loop and open-loop (coordinated-omission-aware) modes"
license = "MIT OR Apache-2.0"

# Built on its own (not a workspace member): it is a measuring tool, not part
# of the runtime, and its dependencies must not enter the product's graph.
[workspace]

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = { version = "7", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }

[profile.release]
debug = "line-tables-only"
