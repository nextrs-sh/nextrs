[package]
name = "nextrs-server"
description = "HTTP server for official Next.js build output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Deliberate image-optimizer defects for the suites' negative controls
# (NEXTRS_IMAGE_NEGATIVE_CONTROL). Never enabled in release builds.
negative-controls = []

[dependencies]
axum.workspace = true
base64.workspace = true
fancy-regex.workspace = true
futures-util.workspace = true
http-body.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
nextrs-adapter.workspace = true
nextrs-runtime.workspace = true
nextrs-image.workspace = true
bytes.workspace = true
libc = "0.2"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
percent-encoding.workspace = true
regex.workspace = true
sha2.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
criterion.workspace = true
futures-util = { workspace = true, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "jpeg"] }
sha2.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[[bench]]
name = "request_path"
harness = false
