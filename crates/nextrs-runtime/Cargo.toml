[package]
name = "nextrs-runtime"
description = "Embedded V8 executor for official Next.js route handlers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only hooks that make an isolate fail on demand (panic, uncaught
# exception, closed channels). Never enabled in release builds; the
# crate's own tests turn it on through the dev-dependency below.
fault-injection = []

[dependencies]
bytes.workspace = true
# Pinned exactly: deno_core and the deno_web/deno_webidl extensions are
# released together and are only compatible within one release train.
deno_core = "=0.413.0"
deno_error = "=0.7.1"
deno_web = "=0.291.0"
deno_webidl = "=0.260.0"
futures-util.workspace = true
getrandom = "0.3"
hyper.workspace = true
reqwest.workspace = true
rustls.workspace = true
url.workspace = true
webpki-roots.workspace = true
md-5 = "0.10"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "time", "net"] }
tracing.workspace = true
aes-gcm = { version = "0.10", features = ["zeroize"] }
hmac = "0.12"
multer = "3"
zeroize = "1"

[dev-dependencies]
nextrs-runtime = { path = ".", features = ["fault-injection"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
futures-util.workspace = true
serde_json.workspace = true
sha2.workspace = true
bytes.workspace = true
tracing-subscriber.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
http-body-util.workspace = true
