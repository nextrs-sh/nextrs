[package]
name = "nextrs-runtime"
description = "Embedded V8 executor for official Next.js route handlers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only hooks that make an isolate fail on demand (panic, uncaught
# exception, closed channels). Never enabled in release builds; the
# crate's own tests turn it on through the dev-dependency below.
fault-injection = []

[dependencies]
bytes.workspace = true
# Pinned exactly: deno_core and the deno_web/deno_webidl extensions are
# released together and are only compatible within one release train.
deno_core = "=0.413.0"
deno_error = "=0.7.1"
deno_web = "=0.291.0"
deno_webidl = "=0.260.0"
futures-util.workspace = true
getrandom = "0.3"
hyper.workspace = true
reqwest.workspace = true
rustls.workspace = true
url.workspace = true
webpki-roots.workspace = true
md-5 = "0.10"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "time", "net"] }
tracing.workspace = true
aes-gcm = { version = "0.10", features = ["zeroize"] }
hmac = "0.12"
# Web Crypto's asymmetric signatures (ECDSA P-256/P-384, RSASSA-PKCS1-v1_5,
# RSA-PSS, Ed25519): ring, which rustls already links. Key formats (SPKI,
# PKCS#8, PKCS#1, SEC1, JWK base64url) are parsed and written by
# RustCrypto's format crates, which do no cryptography themselves.
ring = "0.17.14"
der = { version = "0.7", features = ["alloc", "oid"] }
spki = { version = "0.7", features = ["alloc"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
pkcs1 = { version = "0.7", features = ["alloc"] }
sec1 = { version = "0.7", features = ["der", "alloc"] }
base64ct = { version = "1", features = ["alloc"] }
# AES-CBC and HKDF (JWE's A*CBC-HS* content encryption; Auth.js derives its
# session key with HKDF).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hkdf = "0.12"
# glibc's mallinfo2 for the memory gauge (metrics.rs).
libc = "0.2"
multer = "3"
zeroize = "1"

[dev-dependencies]
criterion.workspace = true
nextrs-runtime = { path = ".", features = ["fault-injection"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
futures-util.workspace = true
serde_json.workspace = true
sha2.workspace = true
bytes.workspace = true
tracing-subscriber.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
http-body-util.workspace = true

[[bench]]
name = "dispatch"
harness = false
