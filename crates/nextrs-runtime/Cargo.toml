[package]
name = "nextrs-runtime"
description = "Embedded V8 executor for official Next.js route handlers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pinned exactly: deno_core and the deno_web/deno_webidl extensions are
# released together and are only compatible within one release train.
deno_core = "=0.413.0"
deno_error = "=0.7.1"
deno_web = "=0.291.0"
deno_webidl = "=0.260.0"
getrandom = "0.3"
md-5 = "0.10"
serde.workspace = true
sha1 = "0.10"
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tracing-subscriber.workspace = true
