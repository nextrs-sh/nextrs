[workspace]
resolver = "3"
members = [
    "crates/nextrs-adapter",
    "crates/nextrs-server",
    "crates/nextrs-runtime",
    "crates/nextrs-cli",
]
# The JS engine experiment links V8 (~100 MB) and is built on its own.
exclude = ["experiments/js-runtime"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
nextrs-adapter = { path = "crates/nextrs-adapter" }
nextrs-server = { path = "crates/nextrs-server" }
nextrs-runtime = { path = "crates/nextrs-runtime" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
futures-util = { version = "0.3", default-features = false }
base64 = "0.22"
bytes = "1.9"
clap = { version = "4", features = ["derive"] }
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
percent-encoding = "2"
regex = "1"
# JavaScript regexes from Next manifests (lookarounds) for routing rules.
fancy-regex = "0.16"
# Outbound fetch: HTTP/1.1 only (as Node's fetch), no system proxy, TLS
# through rustls with ring and the Mozilla root store (as Node's bundled CAs).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
