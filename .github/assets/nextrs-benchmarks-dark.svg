<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="935" viewBox="0 0 1280 935" role="img" aria-labelledby="bench-title bench-desc"><title id="bench-title">NextRS vs next start: Dynamic App Router SSR benchmark, Nov 18, 2026</title><desc id="bench-desc">Dynamic App Router SSR (/books/[id]), measured Nov 18, 2026 on one machine: NextRS f5c480d against next start, Next.js 16.4.6, Node.js 24.18.0, the same Next.js build, median of 3 interleaved rounds. Its run measured this one workload. Throughput: +20% (Higher throughput), NextRS · 1 isolate 736 req/s against next start 611 req/s. Latency: 47% lower (p95 response latency), NextRS · 1 isolate 3.30 ms against next start 6.26 ms. Memory: 63% less (Anonymous memory), NextRS · 1 isolate 141 MiB against next start 376 MiB. CPU: 9% less (CPU time per request), NextRS · 1 isolate 1.75 ms against next start 1.92 ms. Scale across V8 isolates: next start 611 req/s, NextRS · 1 isolate 736 req/s, NextRS · 4 isolates 1,898 req/s; 3.11× measured throughput (NextRS · 4 isolates vs next start). Four isolates share the same four-CPU server allocation; the Node baseline is one server process. Throughput, CPU and memory: closed loop with 32 connections. p95: open loop at 305 req/s for every server. Intel Core i5-9400F, single host. Results vary by workload and hardware; not a production performance guarantee. NextRS f5c480d (working tree had uncommitted changes) · binary sha256 3597a25176ab… · pre-release build. Raw data: benchmarks/results/phase3c/final-bench-f5c480d/readme.</desc><defs><pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#60A5FA"/><rect width="3" height="8" fill="#1D4ED8" fill-opacity="0.45"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="1" y="1" width="1278" height="933" rx="24" fill="#0F172A" stroke="#475569" stroke-width="2"/><text x="48" y="66" class="m" font-size="14" font-weight="600" letter-spacing="2" fill="#93C5FD">EXPERIMENTAL BENCHMARK · NOV 18, 2026</text><text x="48" y="124" font-size="48" font-weight="700" fill="#F8FAFC">NextRS vs <tspan class="m" font-size="48" font-weight="600" fill="#F8FAFC">next start</tspan></text><text x="48" y="161" font-size="21" fill="#CBD5E1">Dynamic App Router SSR · Same Next.js build · Measured results</text><text x="48" y="189" font-size="16" fill="#94A3B8">Next.js 16.4.6 · Node.js 24.18.0 · NextRS f5c480d · /books/[id]</text><rect x="913.2" y="54" width="15" height="15" rx="3" fill="#60A5FA"/><text x="937.2" y="66" font-size="16" fill="#CBD5E1">NextRS · 1 isolate</text><rect x="1108.8" y="54" width="15" height="15" rx="3" fill="#94A3B8"/><text x="1132.8" y="66" class="m" font-size="16" fill="#CBD5E1">next start</text><rect x="48" y="225" width="281" height="307" rx="16" fill="#1E293B" stroke="#475569"/><rect x="70" y="225" width="36" height="3" fill="#93C5FD"/><text x="70" y="263" font-size="14" font-weight="600" letter-spacing="1.6" fill="#94A3B8">THROUGHPUT</text><text x="70" y="328" font-size="60" font-weight="700" fill="#93C5FD">+20%</text><text x="70" y="361" font-size="19" font-weight="500" fill="#F8FAFC">Higher throughput</text><text x="70" y="405" font-size="15.5" fill="#CBD5E1">NextRS · 1 isolate</text><text x="307" y="405" text-anchor="end" font-size="15.5" font-weight="700" fill="#F8FAFC">736 req/s</text><rect x="70" y="414" width="237" height="10" rx="5" fill="#334155"/><rect x="70" y="414" width="237" height="10" rx="5" fill="#60A5FA"/><text x="70" y="455" class="m" font-size="16" fill="#CBD5E1">next start</text><text x="307" y="455" text-anchor="end" font-size="16" font-weight="700" fill="#F8FAFC">611 req/s</text><rect x="70" y="464" width="237" height="10" rx="5" fill="#334155"/><rect x="70" y="464" width="196.8" height="10" rx="5" fill="#94A3B8"/><text x="70" y="510" font-size="14" fill="#94A3B8">Closed loop · higher is better</text><rect x="349" y="225" width="281" height="307" rx="16" fill="#1E293B" stroke="#475569"/><rect x="371" y="225" width="36" height="3" fill="#93C5FD"/><text x="371" y="263" font-size="14" font-weight="600" letter-spacing="1.6" fill="#94A3B8">LATENCY</text><text x="371" y="328" font-size="60" font-weight="700" fill="#93C5FD">47%<tspan dx="8" font-size="27" font-weight="600" fill="#93C5FD">lower</tspan></text><text x="371" y="361" font-size="19" font-weight="500" fill="#F8FAFC">p95 response latency</text><text x="371" y="405" font-size="16" fill="#CBD5E1">NextRS · 1 isolate</text><text x="608" y="405" text-anchor="end" font-size="16" font-weight="700" fill="#F8FAFC">3.30 ms</text><rect x="371" y="414" width="237" height="10" rx="5" fill="#334155"/><rect x="371" y="414" width="124.8" height="10" rx="5" fill="#60A5FA"/><text x="371" y="455" class="m" font-size="16" fill="#CBD5E1">next start</text><text x="608" y="455" text-anchor="end" font-size="16" font-weight="700" fill="#F8FAFC">6.26 ms</text><rect x="371" y="464" width="237" height="10" rx="5" fill="#334155"/><rect x="371" y="464" width="237" height="10" rx="5" fill="#94A3B8"/><text x="371" y="510" font-size="14" fill="#94A3B8">Open loop · lower is better</text><rect x="650" y="225" width="281" height="307" rx="16" fill="#1E293B" stroke="#475569"/><rect x="672" y="225" width="36" height="3" fill="#93C5FD"/><text x="672" y="263" font-size="14" font-weight="600" letter-spacing="1.6" fill="#94A3B8">MEMORY</text><text x="672" y="328" font-size="60" font-weight="700" fill="#93C5FD">63%<tspan dx="8" font-size="27" font-weight="600" fill="#93C5FD">less</tspan></text><text x="672" y="361" font-size="19" font-weight="500" fill="#F8FAFC">Anonymous memory</text><text x="672" y="405" font-size="16" fill="#CBD5E1">NextRS · 1 isolate</text><text x="909" y="405" text-anchor="end" font-size="16" font-weight="700" fill="#F8FAFC">141 MiB</text><rect x="672" y="414" width="237" height="10" rx="5" fill="#334155"/><rect x="672" y="414" width="88.8" height="10" rx="5" fill="#60A5FA"/><text x="672" y="455" class="m" font-size="16" fill="#CBD5E1">next start</text><text x="909" y="455" text-anchor="end" font-size="16" font-weight="700" fill="#F8FAFC">376 MiB</text><rect x="672" y="464" width="237" height="10" rx="5" fill="#334155"/><rect x="672" y="464" width="237" height="10" rx="5" fill="#94A3B8"/><text x="672" y="510" font-size="14" fill="#94A3B8">After load · lower is better</text><rect x="951" y="225" width="281" height="307" rx="16" fill="#1E293B" stroke="#475569"/><rect x="973" y="225" width="36" height="3" fill="#93C5FD"/><text x="973" y="263" font-size="14" font-weight="600" letter-spacing="1.6" fill="#94A3B8">CPU</text><text x="973" y="328" font-size="60" font-weight="700" fill="#93C5FD">9%<tspan dx="8" font-size="27" font-weight="600" fill="#93C5FD">less</tspan></text><text x="973" y="361" font-size="19" font-weight="500" fill="#F8FAFC">CPU time per request</text><text x="973" y="405" font-size="16" fill="#CBD5E1">NextRS · 1 isolate</text><text x="1210" y="405" text-anchor="end" font-size="16" font-weight="700" fill="#F8FAFC">1.75 ms</text><rect x="973" y="414" width="237" height="10" rx="5" fill="#334155"/><rect x="973" y="414" width="215.2" height="10" rx="5" fill="#60A5FA"/><text x="973" y="455" class="m" font-size="16" fill="#CBD5E1">next start</text><text x="1210" y="455" text-anchor="end" font-size="16" font-weight="700" fill="#F8FAFC">1.92 ms</text><rect x="973" y="464" width="237" height="10" rx="5" fill="#334155"/><rect x="973" y="464" width="237" height="10" rx="5" fill="#94A3B8"/><text x="973" y="510" font-size="14" fill="#94A3B8">User + system · lower is better</text><rect x="48" y="552" width="1184" height="210" rx="16" fill="#172554" stroke="#475569"/><text x="74" y="592" font-size="14" font-weight="600" letter-spacing="1.6" fill="#94A3B8">SCALE ACROSS V8 ISOLATES</text><text x="74" y="644" font-size="44" font-weight="700" fill="#93C5FD">3.11×</text><text x="74" y="674" font-size="18" font-weight="500" fill="#F8FAFC">measured throughput</text><text x="74" y="698" font-size="14" fill="#94A3B8">NextRS · 4 isolates vs next start</text><text x="414" y="598" class="m" font-size="17" fill="#CBD5E1">next start</text><rect x="598.2" y="582" width="157.3" height="22" rx="11" fill="#94A3B8"/><text x="767.5" y="598" font-size="17" font-weight="700" fill="#F8FAFC">611 req/s</text><text x="414" y="640" font-size="17" fill="#CBD5E1">NextRS · 1 isolate</text><rect x="598.2" y="624" width="189.4" height="22" rx="11" fill="#60A5FA"/><text x="799.6" y="640" font-size="17" font-weight="700" fill="#F8FAFC">736 req/s</text><text x="414" y="682" font-size="17" fill="#CBD5E1">NextRS · 4 isolates</text><rect x="598.2" y="666" width="488.5" height="22" rx="11" fill="url(#stripes)"/><text x="1098.8" y="682" font-size="17" font-weight="700" fill="#F8FAFC">1,898 req/s</text><text x="74" y="738" font-size="15" fill="#94A3B8">Four isolates share the same four-CPU server allocation; the Node baseline is one server process.</text><circle cx="51" cy="794.7" r="2.5" fill="#94A3B8"/><text x="64" y="800" font-size="16" fill="#CBD5E1">Same Next.js build · 3 interleaved rounds</text><circle cx="643" cy="794.7" r="2.5" fill="#94A3B8"/><text x="656" y="800" font-size="16" fill="#CBD5E1">32 connections for throughput/CPU/memory</text><circle cx="51" cy="819.7" r="2.5" fill="#94A3B8"/><text x="64" y="825" font-size="16" fill="#CBD5E1">Open-loop p95 at 305 req/s</text><circle cx="643" cy="819.7" r="2.5" fill="#94A3B8"/><text x="656" y="825" font-size="16" fill="#CBD5E1">Intel Core i5-9400F · Single host</text><text x="48" y="858" font-size="15" fill="#94A3B8">Results vary by workload and hardware. Not a production performance guarantee.</text><text x="48" y="881" class="m" font-size="14" fill="#94A3B8">Raw data: benchmarks/results/phase3c/final-bench-f5c480d/readme</text><text x="48" y="90