<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">How NextRS serves a Next.js build</title>
<desc id="arch-desc">On the left, a Next.js app is compiled by next build into the .next output: manifests, static assets, prerendered HTML and RSC payloads, and compiled server handlers. Node.js is needed for the build, not for serving. The NextRS runtime, a single Rust process, reads that output. Its Rust HTTP server applies routing and next.config rules, then sends each request one of two ways. Static files, prerendered HTML and RSC, and image optimization are served directly from Rust. Dynamic rendering, React Server Components, Route Handlers, Server Actions and proxy.ts run Next.js's own compiled JavaScript handlers in embedded V8 isolates, enabled with --js-runtime embedded-v8. Those handlers use a shared cache held in Rust for the data cache, ISR pages and "use cache" entries.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .eyebrow { font-size: 15px; letter-spacing: 2.4px; font-weight: 600; }
  .h1 { font-size: 30px; font-weight: 700; fill: #F0F6FC; }
  .h2 { font-size: 24px; font-weight: 600; fill: #F0F6FC; }
  .h3 { font-size: 21px; font-weight: 600; fill: #F0F6FC; }
  .body { font-size: 19px; fill: #C9D1D9; }
  .muted { font-size: 18px; fill: #8B949E; }
  .code { font-size: 15px; fill: #8B949E; }

  .dot { opacity: 0; }
  @keyframes build-down {
    0%   { opacity: 0; transform: translate(0, 0); }
    3%   { opacity: .9; }
    12%  { opacity: .9; transform: translate(0, 90px); }
    15%, 100% { opacity: 0; transform: translate(0, 90px); }
  }
  @keyframes build-out {
    0%   { opacity: 0; transform: translate(0, 0); }
    3%   { opacity: .9; }
    9%   { opacity: .9; transform: translate(34px, 0); }
    12%, 100% { opacity: 0; transform: translate(34px, 0); }
  }
  @keyframes req-in {
    0%   { opacity: 0; transform: translate(0, 0); }
    4%   { opacity: 1; }
    15%  { opacity: 1; transform: translate(0, 80px); }
    18%, 100% { opacity: 0; transform: translate(0, 80px); }
  }
  @keyframes lane-hop {
    0%   { opacity: 0; transform: translate(0, 0); }
    3%   { opacity: 1; }
    11%  { opacity: 1; transform: translate(0, 38px); }
    14%, 100% { opacity: 0; transform: translate(0, 38px); }
  }
  @keyframes glow {
    0%, 100% { opacity: 0; }
    5% { opacity: 1; }
    20% { opacity: 0; }
  }
  .build-a { animation: build-down 8s linear infinite; }
  .build-b { animation: build-out 8s linear infinite; animation-delay: 1.2s; }
  .req-a  { animation: req-in 8s linear infinite; animation-delay: 1s; }
  .req-b  { animation: req-in 8s linear infinite; animation-delay: 4.6s; }
  .hop-rust { animation: lane-hop 8s linear infinite; animation-delay: 2.5s; }
  .hop-v8   { animation: lane-hop 8s linear infinite; animation-delay: 6.1s; }
  .hop-cache { animation: lane-hop 8s linear infinite; animation-delay: 7.1s; }
  .glow { opacity: 0; }
  .glow-router-a { animation: glow 8s ease-out infinite; animation-delay: 2.1s; }
  .glow-router-b { animation: glow 8s ease-out infinite; animation-delay: 5.7s; }
  .glow-rust  { animation: glow 8s ease-out infinite; animation-delay: 3.3s; }
  .glow-v8    { animation: glow 8s ease-out infinite; animation-delay: 6.9s; }
  .glow-cache { animation: glow 8s ease-out infinite; animation-delay: 7.9s; }

  @media (prefers-reduced-motion: reduce) {
    .dot, .glow { animation: none !important; opacity: 0 !important; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#8B949E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#E8762D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

