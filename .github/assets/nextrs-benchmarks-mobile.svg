<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1614" viewBox="0 0 720 1614" role="img" aria-labelledby="bench-title bench-desc"><title id="bench-title">NextRS vs next start: Dynamic App Router SSR benchmark, Nov 18, 2026</title><desc id="bench-desc">Dynamic App Router SSR (/books/[id]), measured Nov 18, 2026 on one machine: NextRS f5c480d against next start, Next.js 16.4.6, Node.js 24.18.0, the same Next.js build, median of 3 interleaved rounds. Its run measured this one workload. Throughput: +20% (Higher throughput), NextRS · 1 isolate 736 req/s against next start 611 req/s. Latency: 47% lower (p95 response latency), NextRS · 1 isolate 3.30 ms against next start 6.26 ms. Memory: 63% less (Anonymous memory), NextRS · 1 isolate 141 MiB against next start 376 MiB. CPU: 9% less (CPU time per request), NextRS · 1 isolate 1.75 ms against next start 1.92 ms. Scale across V8 isolates: next start 611 req/s, NextRS · 1 isolate 736 req/s, NextRS · 4 isolates 1,898 req/s; 3.11× measured throughput (NextRS · 4 isolates vs next start). Four isolates share the same four-CPU server allocation; the Node baseline is one server process. Throughput, CPU and memory: closed loop with 32 connections. p95: open loop at 305 req/s for every server. Intel Core i5-9400F, single host. Results vary by workload and hardware; not a production performance guarantee. NextRS f5c480d (working tree had uncommitted changes) · binary sha256 3597a25176ab… · pre-release build. Raw data: benchmarks/results/phase3c/final-bench-f5c480d/readme.</desc><defs><pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#E8622F"/><rect width="3" height="8" fill="#FFB08A" fill-opacity="0.45"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="1" y="1" width="718" height="1612" rx="24" fill="#0D1117" stroke="#30363D" stroke-width="2"/><text x="28" y="58" class="m" font-size="15" font-weight="600" letter-spacing="2" fill="#FF7B45">EXPERIMENTAL BENCHMARK · NOV 18, 2026</text><text x="28" y="112" font-size="44" font-weight="700" fill="#F0F6FC">NextRS vs <tspan class="m" font-size="44" font-weight="600" fill="#F0F6FC">next start</tspan></text><text x="28" y="149" font-size="21" fill="#C9D1D9">Dynamic App Router SSR · Same Next.js build</text><text x="28" y="182" font-size="21" fill="#C9D1D9">Measured results</text><text x="28" y="211" font-size="17" fill="#8B949E">Next.js 16.4.6 · Node.js 24.18.0 · NextRS f5c480d · /books/[id]</text><rect x="28" y="237.5" width="15" height="15" rx="3" fill="#E8622F"/><text x="52" y="251" font-size="18" fill="#C9D1D9">NextRS · 1 isolate</text><rect x="241.8" y="237.5" width="15" height="15" rx="3" fill="#6E7681"/><text x="265.8" y="251" class="m" font-size="18" fill="#C9D1D9">next start</text><rect x="28" y="281" width="324" height="318" rx="16" fill="#161B22" stroke="#30363D"/><rect x="50" y="281" width="36" height="3" fill="#FF7B45"/><text x="50" y="319" font-size="15" font-weight="600" letter-spacing="1.6" fill="#8B949E">THROUGHPUT</text><text x="50" y="388" font-size="64" font-weight="700" fill="#FF7B45">+20%</text><text x="50" y="422" font-size="20" font-weight="500" fill="#F0F6FC">Higher throughput</text><text x="50" y="467" font-size="17" fill="#C9D1D9">NextRS · 1 isolate</text><text x="330" y="467" text-anchor="end" font-size="17" font-weight="700" fill="#F0F6FC">736 req/s</text><rect x="50" y="476" width="280" height="12" rx="6" fill="#21262D"/><rect x="50" y="476" width="280" height="12" rx="6" fill="#E8622F"/><text x="50" y="519" class="m" font-size="17" fill="#C9D1D9">next start</text><text x="330" y="519" text-anchor="end" font-size="17" font-weight="700" fill="#F0F6FC">611 req/s</text><rect x="50" y="528" width="280" height="12" rx="6" fill="#21262D"/><rect x="50" 