<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1676" viewBox="0 0 720 1676" role="img" aria-labelledby="bench-title bench-desc"><title id="bench-title">NextRS vs next start — Reproducible Benchmark Results</title><desc id="bench-desc">Measured 2026-11-18 on NextRS 0.6.0 (f5c480d), Next.js 16.4.6: Dynamic App Router SSR (/books/[id]); throughput, CPU and memory in a closed loop with 32 connections, p95 latency in an open loop at an equal offered rate; median of 3 interleaved rounds on one machine. Throughput: next start 611 req/s, NextRS · 1 isolate 736 req/s, NextRS · 4 isolates 1,898 req/s. p95 latency: next start 6.26 ms, NextRS · 1 isolate 3.30 ms. Anonymous memory: next start 376 MiB, NextRS · 1 isolate 141 MiB. CPU per request: next start 1.92 ms, NextRS · 1 isolate 1.75 ms.</desc><style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="1" y="1" width="718" height="1674" rx="24" fill="#0D1117" stroke="#21262D" stroke-width="2"/><text x="32" y="70" class="mono" font-size="15" font-weight="600" letter-spacing="2.4" fill="#E8762D">PHASE 3A · REPRODUCIBLE BENCHMARK · EXPERIMENTAL</text><text x="32" y="112" class="sans" font-size="26" font-weight="700" fill="#F0F6FC">NextRS vs <tspan class="mono">next start</tspan> —</text><text x="32" y="150" class="sans" font-size="26" font-weight="700" fill="#F0F6FC">Reproducible Benchmark Results</text><text x="32" y="186" class="sans" font-size="18" fill="#8B949E">Dynamic App Router SSR · <tspan class="mono" font-size="17">/books/[id]</tspan></text><text x="32" y="214" class="sans" font-size="16" fill="#8B949E">Next.js 16.4.6 · NextRS 0.6.0 · 2026-11-18 · median of 3 interleaved rounds</text><rect x="32" y="268" width="656" height="250" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="60" y="314" class="sans" font-size="25" font-weight="600" fill="#F0F6FC">Throughput</text><text x="60" y="344" class="sans" font-size="16" fill="#8B949E">requests per second · higher is better</text><text x="60" y="397" class="mono" font-size="17" fill="#C9D1D9">next start</text><rect x="270" y="376" width="77.3" height="28" rx="7" fill="#8B949E"/><text x="359.3" y="397" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">611 req/s</text><text x="60" y="437" class="sans" font-size="18" fill="#C9D1D9">NextRS · 1 isolate</text><rect x="270" y="416" width="93.0" height="28" rx="7" fill="#CE422B"/><text x="375.0" y="437" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">736 req/s</text><text x="60" y="477" class="sans" font-size="18" fill="#C9D1D9">NextRS · 4 isolates</text><rect x="270" y="456" width="240.0" height="28" rx="7" fill="#E0705A"/><text x="522.0" y="477" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">1,898 req/s</text><rect x="32" y="542" width="656" height="250" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="60" y="588" class="sans" font-size="25" font-weight="600" fill="#F0F6FC">p95 latency</text><text x="60" y="618" class="sans" font-size="16" fill="#8B949E">open loop at 305 req/s for both · lower is better</text><text x="60" y="671" class="mono" font-size="17" fill="#C9D1D9">next start</text><rect x="270" y="650" width="240.0" height="28" rx="7" fill="#8B949E"/><text x="522.0" y="671" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">6.26 ms</text><text x="60" y="727" class="sans" font-size="18" fill="#C9D1D9">NextRS · 1 isolate</text><rect x="270" y="706" width="126.3" height="28" rx="7" fill="#CE422B"/><text x="408.3" y="727" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">3.30 ms</text><rect x="32" y="816" width="656" height="250" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="60" y="862" class="sans" font-size="25" font-weight="600" fill="#F0F6FC">Anonymous memory</text><text x="60" y="892" class="sans" font-size="16" fill="#8B949E">process-tree anonymous RSS after load · lower is better</text><text x="60" y="945" class="mono" font-size="17" fill="#C9D1D9">next start</text><rect x="270" y="924" width="240.0" height="28" rx="7" fill="#8B949E"/><text x="522.0" y="945" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">376 MiB</text><text x="60" y="1001" class="sans" font-size="18" fill="#C9D1D9">NextRS · 1 isolate</text><rect x="270" y="980" width="89.9" height="28" rx="7" fill="#CE422B"/><text x="371.9" y="1001" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">141 MiB</text><rect x="32" y="1090" width="656" height="250" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="60" y="1136" class="sans" font-size="25" font-weight="600" fill="#F0F6FC">CPU per request</text><text x="60" y="1166" class="sans" font-size="16" fill="#8B949E">server CPU time (user + system) · lower is better</text><text x="60" y="1219" class="mono" font-size="17" fill="#C9D1D9">next start</text><rect x="270" y="1198" width="240.0" height="28" rx="7" fill="#8B949E"/><text x="522.0" y="1219" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">1.92 ms</text><text x="60" y="1275" class="sans" font-size="18" fill="#C9D1D9">NextRS · 1 isolate</text><rect x="270" y="1254" width="218.0" height="28" rx="7" fill="#CE422B"/><text x="500.0" y="1275" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">1.75 ms</text><text x="32" y="1404" class="sans" font-size="15" fill="#C9D1D9">Workload: Dynamic App Router SSR — /books/[id] · 1 workloads measured, each</text><text x="32" y="1428" class="sans" font-size="15" fill="#C9D1D9">reported separately.</text><text x="32" y="1452" class="sans" font-size="15" fill="#C9D1D9">Next.js 16.4.6 on Node v24.18.0 · NextRS 0.6.0 · 1 and 4 V8 isolate(s) · Intel(R)</text><text x="32" y="1476" class="sans" font-size="15" fill="#C9D1D9">Core(TM) i5-9400F CPU @ 2.90GHz, server on CPUs 0-3, load generator on 4-5 (single</text><text x="32" y="1500" class="sans" font-size="15" fill="#C9D1D9">host)</text><text x="32" y="1524" class="sans" font-size="15" fill="#C9D1D9">2026-11-18 · same .next build · closed loop, 32 connections; p95 open loop at an</text><text x="32" y="1548" class="sans" font-size="15" fill="#C9D1D9">equal offered rate · 3 interleaved rounds, medians · raw data:</text><text x="32" y="1572" class="sans" font-size="15" fill="#C9D1D9">benchmarks/results/phase3c/final-bench-f5c480d/readme</text><text x="32" y="1596" class="sans" font-size="15" fill="#8B949E">Results are specific to the tested workloads, hardware, and runtime</text><text x="32" y="1620" class="sans" font-size="15" fill="#8B949E">configurations. They are not guarantees of production performance.</text></svg>
