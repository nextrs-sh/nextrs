etter</text><text x="76" y="613" class="mono" font-size="17" fill="#C9D1D9">next start</text><rect x="276" y="592" width="170.0" height="28" rx="7" fill="#8B949E"/><text x="458.0" y="613" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">376 MiB</text><text x="76" y="669" class="sans" font-size="18" fill="#C9D1D9">NextRS · 1 isolate</text><rect x="276" y="648" width="63.7" height="28" rx="7" fill="#CE422B"/><text x="351.7" y="669" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">141 MiB</text><rect x="656" y="484" width="576" height="250" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="684" y="530" class="sans" font-size="25" font-weight="600" fill="#F0F6FC">CPU per request</text><text x="684" y="560" class="sans" font-size="16" fill="#8B949E">server CPU time (user + system) · lower is better</text><text x="684" y="613" class="mono" font-size="17" fill="#C9D1D9">next start</text><rect x="884" y="592" width="170.0" height="28" rx="7" fill="#8B949E"/><text x="1066.0" y="613" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">1.92 ms</text><text x="684" y="669" class="sans" font-size="18" fill="#C9D1D9">NextRS · 1 isolate</text><rect x="884" y="648" width="154.4" height="28" rx="7" fill="#CE422B"/><text x="1050.4" y="669" class="sans" font-size="20" font-weight="700" fill="#F0F6FC">1.75 ms</text><text x="48" y="798" class="sans" font-size="15" fill="#C9D1D9">Workload: Dynamic App Router SSR — /books/[id] · 1 workloads measured, each reported separately.</text><text x="48" y="822" class="sans" font-size="15" fill="#C9D1D9">Next.js 16.4.6 on Node v24.18.0 · NextRS f5c480d · 1 and 4 V8 isolate(s) · Intel(R) Core(TM) i5-9400F CPU @ 2.90GHz, server on CPUs 0-3, load</text><text x="48" y="846" class="sans" font-size="15" fill="#C9D1D9">generator on 4-5 (single host)</text><text x="48" y="870" class="sans" font-size="15" fill="#C9D1D9">2026-11-18 · same .next build · closed loop, 32 connections; p95 open loop at an equal o