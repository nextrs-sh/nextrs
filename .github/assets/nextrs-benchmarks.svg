<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="bench-title bench-desc">
<title id="bench-title">Preliminary benchmarks: NextRS and next start, dynamic SSR</title>
<desc id="bench-desc">Preliminary benchmark, historical, Phase 1A (b43a255), measured 2026-11-03. Dynamic server-side rendering of /books/42 in a Next.js 16.4.3 App Router fixture at 32 concurrent requests, median of 3 runs on one machine. Throughput (requests per second · higher is better): NextRS 648 req/s, next start 453 req/s. Latency (p95 response time · lower is better): NextRS 58.5 ms, next start 79.9 ms. Memory (process-tree RSS after load · lower is better): NextRS 222.8 MiB, next start 268.8 MiB. CPU (server CPU time per request · lower is better): NextRS 1.88 ms, next start 2.38 ms.</desc>
