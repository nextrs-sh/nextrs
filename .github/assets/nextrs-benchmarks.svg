<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="974" viewBox="0 0 1280 974" role="img" aria-labelledby="bench-title bench-desc"><title id="bench-title">NextRS vs next start — Reproducible Benchmark Results</title><desc id="bench-desc">Measured 2026-11-18 on NextRS f5c480d, Next.js 16.4.6: Dynamic App Router SSR (/books/[id]); throughput, CPU and memory in a closed loop with 32 connections, p95 latency in an open loop at an equal offered rate; median of 3 interleaved rounds on one machine. Throughput: next start 611 req/s, NextRS · 1 isolate 736 req/s, NextRS · 4 isolates 1,898 req/s. p95 latency: next start 6.26 ms, NextRS · 1 isolate 3.30 ms. Anonymous memory: next start 376 MiB, NextRS · 1 isolate 141 MiB. CPU per request: next start 1.92 ms, NextRS · 1 isolate 1.75 ms.</desc><style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style><rect x="1" y="1" width="1278" height="972" rx="24" fill="#0D1117" stroke="#21262D" stroke-width="2"/><text x="48" y="70" class="mono" font-size="15" font-weight="600" letter-spacing="2.4" fill="#E8762D">PHASE 3A · REPRODUCIBLE BENCHMARK · EXPERIMENTAL</text><text x="48" y="112" class="sans" font-size="32" font-weight="700" fill="#F0F6FC">NextRS vs <tspan class="mono">next start</tspan> — Reproducible Benchmark Results</text><text x="48" y="148" class="sans" font-size="18" fill="#8B949E">Dynamic App Router SSR · <tspan class="mono" font-size="17">/books/[id]</tspan></text><text x="48" y="176" class="sans" font-size="16" fill="#8B949E">Next.js 16.4.6 · NextRS f5c480d · 2026-11-18 · median of 3 interleaved rounds</text><rect x="48" y="210" width="576" height="250" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="76" y="256" class="sans" font-size="25" font-weight="600" fill="#F0F6FC">Throughput</text><text x="76" y="286" class="sans" font-size="16" fi