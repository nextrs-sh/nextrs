<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">How NextRS serves a Next.js build</title>
<desc id="arch-desc">A Next.js app (App Router, Pages Router) is compiled by next build into the .next output: manifests, static assets, prerendered HTML and RSC payloads, and compiled server handlers. Node.js is needed for the build, not for serving. The NextRS runtime, a single Rust process, reads that output. Its Rust HTTP server applies routing and next.config rules, then sends each request one of two ways. Static files, prerendered HTML and RSC, and image optimization are served directly from Rust. Dynamic rendering, React Server Components, Route Handlers, Server Actions and proxy.ts run Next.js's own compiled JavaScript handlers in embedded V8 isolates, enabled with --js-runtime embedded-v8. Those handlers use a shared cache held in Rust for the data cache, ISR pages and "use cache" entries. Below the runtime, your backends (APIs, databases, authentication services) stay separate processes, unchanged, reached with fetch only where --net-allow permits.</desc>
