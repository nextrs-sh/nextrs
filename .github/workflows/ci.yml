name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned: a new stable release can add clippy lints that fail
      # -D warnings without any change here. Bump deliberately.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rusty_v8's build script downloads its static library into
      # target/<profile>/gn_out, which rust-cache does not keep. When a
      # partially matching cache restores v8's build-script output but v8
      # itself must be recompiled, the link fails ("could not find native
      # static library rusty_v8"); cleaning v8 makes its build script run.
      - name: Re-fetch rusty_v8 when the cache lacks it
        run: |
          for profile in debug release; do
            if [ -d "target/$profile/build" ] && ! ls target/$profile/gn_out/obj/librusty_v8.a >/dev/null 2>&1; then
              flag=""; [ "$profile" = release ] && flag="--release"
              cargo clean -p v8 $flag
            fi
          done
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the executor's backpressure, supervision, deadline, pool,
      # request-body and isolation tests, outbound fetch against local
      # upstreams (no public services) and the shared data cache (no
      # Next.js build needed).
      - run: cargo test --workspace

  audit:
    name: dependency audit (RustSec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; unmaintained crates are reported only.
      - run: cargo audit

  compat:
    name: next ${{ matrix.next }}, ${{ matrix.isolates }} isolate(s)
    needs: rust
    runs-on: ubuntu-24.04
    # Only the pinned baseline gates merges. Other versions are reported,
    # and become supported only after they pass and are recorded.
    continue-on-error: ${{ matrix.next != 'pinned' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { next: pinned, isolates: 1 }
          - { next: pinned, isolates: 4 }
          - { next: "16.4.4", isolates: 1 }
          - { next: "16.4.5", isolates: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: |
            fixtures/next-app/package-lock.json
            fixtures/next-auth-proxy/package-lock.json
            fixtures/next-intl-proxy/package-lock.json
            fixtures/next-platform-proxy/package-lock.json
            fixtures/next-image/package-lock.json
      # rusty_v8's build script downloads its static library into
      # target/<profile>/gn_out, which rust-cache does not keep. When a
      # partially matching cache restores v8's build-script output but v8
      # itself must be recompiled, the link fails ("could not find native
      # static library rusty_v8"); cleaning v8 makes its build script run.
      - name: Re-fetch rusty_v8 when the cache lacks it
        run: |
          for profile in debug release; do
            if [ -d "target/$profile/build" ] && ! ls target/$profile/gn_out/obj/librusty_v8.a >/dev/null 2>&1; then
              flag=""; [ "$profile" = release ] && flag="--release"
              cargo clean -p v8 $flag
            fi
          done
      - run: cargo build --release -p nextrs-cli
      - name: Browser for the Server Action suite
        if: matrix.next == 'pinned'
        working-directory: tests/browser
        run: npm ci --no-audit --no-fund && npx playwright-core install --with-deps chromium-headless-shell
      - name: Build the pinned fixture
        if: matrix.next == 'pinned'
        working-directory: fixtures/next-app
        run: npm ci --no-audit --no-fund && npx next build
      - name: Fixture-dependent Rust tests (HTTP layer, sockets, memory)
        if: matrix.next == 'pinned' && matrix.isolates == 1
        run: cargo test -p nextrs-server --test dynamic --test reliability --test memory --test proxy -- --ignored
      # Also runs a local upstream API for the data-fetching suites and
      # restarts both servers once to check data cache persistence. --images
      # runs the /_next/image suites against a local image upstream (no
      # public hosts; the image engine needs no system libraries).
      - name: HTTP comparison against next start
        run: |
          if [ "${{ matrix.next }}" = pinned ]; then
            scripts/compat-suite.sh --isolates ${{ matrix.isolates }} --out compat-out --browser --cache-components --proxy --proxy-combinations --images
          else
            scripts/compat-suite.sh --next ${{ matrix.next }} --isolates ${{ matrix.isolates }} --out compat-out --cache-components --proxy --images
          fi
      # Applications using maintained libraries in proxy.ts (jose sessions,
      # next-intl locale routing) and a data-driven proxy with external
      # rewrites, instrumentation, waitUntil and Draft Mode.
      - name: Real-world proxy applications against next start
        run: |
          if [ "${{ matrix.next }}" = pinned ]; then
            scripts/realworld-suite.sh --isolates ${{ matrix.isolates }} --out realworld-out --browser
          else
            scripts/realworld-suite.sh --next ${{ matrix.next }} --isolates ${{ matrix.isolates }} --out realworld-out
          fi
      - name: Graceful shutdown with proxy work in flight
        if: matrix.next == 'pinned' && matrix.isolates == 1
        run: |
          node tests/compat/upstream.mjs --port 5602 > upstream.log 2>&1 &
          (cd fixtures/next-proxy && npm ci --no-audit --no-fund && npx next build)
          (cd fixtures/next-platform-proxy && npm ci --no-audit --no-fund && \
            NEXTRS_UPSTREAM=http://127.0.0.1:5602 NEXTRS_CLOSED_PORT=5603 NEXTRS_UNLISTED_PORT=5604 npx next build)
          NEXTRS_CLOSED_PORT=5603 NEXTRS_UNLISTED_PORT=5604 node tests/compat/proxy-shutdown.mjs \
            --nextrs target/release/nextrs --platform fixtures/next-platform-proxy --proxy fixtures/next-proxy \
            --upstream http://127.0.0.1:5602 --json realworld-out/proxy-shutdown.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.next }}-i${{ matrix.isolates }}
          path: |
            compat-out
            realworld-out
          if-no-files-found: ignore
