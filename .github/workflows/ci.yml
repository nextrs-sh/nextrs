name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the executor's backpressure, supervision, deadline, pool,
      # request-body and isolation tests, outbound fetch against local
      # upstreams (no public services) and the shared data cache (no
      # Next.js build needed).
      - run: cargo test --workspace

  audit:
    name: dependency audit (RustSec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; unmaintained crates are reported only.
      - run: cargo audit

  compat:
    name: next ${{ matrix.next }}, ${{ matrix.isolates }} isolate(s)
    needs: rust
    runs-on: ubuntu-24.04
    # Only the pinned baseline gates merges. Other versions are reported,
    # and become supported only after they pass and are recorded.
    continue-on-error: ${{ matrix.next != 'pinned' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { next: pinned, isolates: 1 }
          - { next: pinned, isolates: 4 }
          - { next: "16.4.4", isolates: 1 }
          - { next: "16.4.5", isolates: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: fixtures/next-app/package-lock.json
      - run: cargo build --release -p nextrs-cli
      - name: Build the pinned fixture
        if: matrix.next == 'pinned'
        working-directory: fixtures/next-app
        run: npm ci --no-audit --no-fund && npx next build
      - name: Fixture-dependent Rust tests (HTTP layer, sockets, memory)
        if: matrix.next == 'pinned' && matrix.isolates == 1
        run: cargo test -p nextrs-server --test dynamic --test reliability --test memory -- --ignored
      # Also runs a local upstream API for the data-fetching suites and
      # restarts both servers once to check data cache persistence.
      - name: HTTP comparison against next start
        run: |
          if [ "${{ matrix.next }}" = pinned ]; then
            scripts/compat-suite.sh --isolates ${{ matrix.isolates }} --out compat-out
          else
            scripts/compat-suite.sh --next ${{ matrix.next }} --isolates ${{ matrix.isolates }} --out compat-out
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.next }}-i${{ matrix.isolates }}
          path: compat-out
          if-no-files-found: ignore
