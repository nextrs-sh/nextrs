name: npm publish (maintainers)

# Publishes @nextrs/cli to the public npm registry. It never runs on its
# own: a maintainer dispatches it from main, and the `npm-publish`
# environment (Settings → Environments: required reviewers, deployment
# branch main only) must approve the job before any step runs.
#
# What it publishes is rebuilt from the published GitHub release, never from
# a CI build:
#   1. the tag v<version> must point at a commit on main; the release
#      archive's own commit is that commit, or an ancestor when the commits
#      after it add only release/checksums/ (the checksum records cannot be
#      inside the commit that the archive records);
#   2. the archive, its .sha256 and manifest are downloaded from the
#      published (non-draft) GitHub release v<version>, and must equal the
#      records committed in release/checksums/ (archive, binary);
#   3. scripts/package-npm.sh packs the archive's binary (packing is
#      deterministic); the tarball's SHA-256 must equal the committed
#      record, and scripts/verify-npm-package.sh must pass;
#   4. npm publish with the dist-tag `next` for a prerelease; `latest` only
#      for a stable version and only with promote_latest;
#   5. after a real publish, the registry's integrity, dist-tags and
#      provenance attestation are checked.
#
# Authentication (input `auth`):
#   trusted-publishing  npm trusted publishing (OIDC); no token exists. The
#                       default, and the only mode once the package exists.
#   bootstrap-token     the first publish only: npm can configure a trusted
#                       publisher only for a package that already exists.
#                       Uses the `npm-publish` environment's NPM_TOKEN secret
#                       and refuses to run if the package is already on the
#                       registry. Revoke the token right after.
# dry_run (the default) stops before uploading: it runs `npm publish --dry-run`.
# See release/npm-publishing.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, e.g. 0.1.0-rc.1 (the GitHub release v<version> must exist)"
        required: true
      dry_run:
        description: "Stop before uploading (npm publish --dry-run)"
        type: boolean
        default: true
      auth:
        description: "trusted-publishing (OIDC), or bootstrap-token for the package's very first publish"
        type: choice
        options: [trusted-publishing, bootstrap-token]
        default: trusted-publishing
      promote_latest:
        description: "Stable versions only: also move the latest dist-tag (refused for a prerelease)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish @nextrs/cli ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}
    # Only from the default branch, never from a pull request or a fork.
    if: github.ref == 'refs/heads/main' && github.repository == 'nextrs-sh/nextrs'
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ inputs.version }}
      AUTH: ${{ inputs.auth }}
      PROMOTE_LATEST: ${{ inputs.promote_latest }}
      DRY_RUN: ${{ inputs.dry_run }}
      PACKAGE: "@nextrs/cli"
    steps:
      - name: Inputs
        run: |
          set -eu
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' || { echo "not a release version: $VERSION"; exit 1; }
          case "$AUTH" in trusted-publishing|bootstrap-token) ;; *) echo "unknown auth $AUTH"; exit 1 ;; esac
          case "$VERSION" in
            *-*) [ "$PROMOTE_LATEST" = false ] || { echo "promote_latest is refused for a prerelease"; exit 1; } ;;
          esac
          echo "version $VERSION, auth $AUTH, dry_run $DRY_RUN, promote_latest $PROMOTE_LATEST"
      # Actions are pinned by commit, as this job can mint an OIDC token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tagged commit: package.json, README and the checksum records as released.
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: |
          set -eu
          tag_commit=$(git rev-parse "refs/tags/v$VERSION^{commit}")
          [ "$(git rev-parse HEAD)" = "$tag_commit" ] || { echo "the checkout is not v$VERSION"; exit 1; }
          git merge-base --is-ancestor "$tag_commit" origin/main || { echo "v$VERSION ($tag_commit) is not on main"; exit 1; }
          echo "v$VERSION is $tag_commit, on main"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node.js 24.18.0 ships npm 11.16.0; the next step checks it rather than assuming it.
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
      - name: Node.js and npm support trusted publishing
        run: |
          set -eu
          # npm documents: npm CLI 11.5.1 or later and Node.js 22.14.0 or later.
          node -e '
            const ge = (v, m) => { const a = v.split(".").map(Number), b = m.split(".").map(Number);
              for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return true; };
            const node = process.versions.node, npm = process.argv[1];
            console.log(`node ${node}, npm ${npm}`);
            if (!ge(node, "22.14.0")) { console.error("Node.js 22.14.0 or later is required"); process.exit(1); }
            if (!ge(npm, "11.5.1")) { console.error("npm 11.5.1 or later is required for trusted publishing"); process.exit(1); }
          ' "$(npm --version)"
      - name: Download the GitHub release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease \
            -q '"\(.tagName) \(.isDraft) \(.isPrerelease)"' > release.txt
          read -r tag draft prerelease < release.txt
          { [ "$tag" = "v$VERSION" ] && [ "$draft" = false ]; } || { echo "v$VERSION is not a published release: $(cat release.txt)"; exit 1; }
          echo "$prerelease" > prerelease
          mkdir dist
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D dist \
            -p "nextrs-v$VERSION-linux-x86_64.tar.gz" -p "nextrs-v$VERSION-linux-x86_64.tar.gz.sha256" -p "nextrs-v$VERSION-linux-x86_64.manifest.json"
      - name: Checksums and commits agree with the committed records
        run: |
          set -eu
          a=nextrs-v$VERSION-linux-x86_64
          (cd dist && sha256sum -c "$a.tar.gz.sha256")
          want_archive=$(cut -d' ' -f1 "release/checksums/$a.tar.gz.sha256")
          want_binary=$(cut -d' ' -f1 "release/checksums/$a.binary.sha256")
          [ "$(sha256sum "dist/$a.tar.gz" | cut -d' ' -f1)" = "$want_archive" ] || { echo "the archive differs from release/checksums"; exit 1; }
          [ "$(node -p "require('./dist/$a.manifest.json').binary_sha256")" = "$want_binary" ] || { echo "the manifest's binary differs from release/checksums"; exit 1; }
          # The archive records the commit it was packaged at: the tag, or an
          # ancestor when the later commits add only the checksum records.
          archive_commit=$(node -p "require('./dist/$a.manifest.json').commit")
          if [ "$archive_commit" != "$(git rev-parse HEAD)" ]; then
            git merge-base --is-ancestor "$archive_commit" HEAD || { echo "the archive's commit $archive_commit is not an ancestor of v$VERSION"; exit 1; }
            other=$(git diff --name-only "$archive_commit" HEAD | grep -v '^release/checksums/' || true)
            [ -z "$other" ] || { echo "v$VERSION changes more than release/checksums/ since the archive's commit $archive_commit:"; echo "$other"; exit 1; }
          fi
          echo "archive $want_archive, binary $want_binary, packaged at $archive_commit"
          echo "WANT_BINARY=$want_binary" >> "$GITHUB_ENV"
      - name: Pack (deterministic) and verify
        run: |
          set -eu
          scripts/package-npm.sh --archive "dist/nextrs-v$VERSION-linux-x86_64.tar.gz" --expect-binary-sha256 "$WANT_BINARY" --out npm
          want=$(cut -d' ' -f1 "release/checksums/nextrs-cli-$VERSION.tgz.sha256")
          got=$(cut -d' ' -f1 "npm/nextrs-cli-$VERSION.tgz.sha256")
          [ "$got" = "$want" ] || { echo "npm tarball $got differs from release/checksums ($want)"; exit 1; }
      - name: Dist-tag (never latest for a prerelease, never automatically)
        run: |
          set -eu
          case "$VERSION" in
            *-*)
              [ "$(cat prerelease)" = true ] || { echo "v$VERSION is not marked prerelease on GitHub"; exit 1; }
              tag=next ;;
            *)
              [ "$(cat prerelease)" = false ] || { echo "v$VERSION is a stable version but marked prerelease on GitHub"; exit 1; }
              [ "$PROMOTE_LATEST" = true ] || { echo "a stable version needs promote_latest=true to become latest"; exit 1; }
              tag=latest ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "dist-tag $tag"
      - name: Registry state and authentication mode
        env:
          HAVE_TOKEN: ${{ inputs.auth == 'bootstrap-token' && secrets.NPM_TOKEN != '' }}
        run: |
          set -eu
          if npm view "$PACKAGE" name > /dev/null 2> view.err; then exists=true
          elif grep -q E404 view.err; then exists=false
          else cat view.err; exit 1; fi
          if [ "$exists" = true ] && npm view "$PACKAGE@$VERSION" version > /dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already on the registry"; exit 1
          fi
          case "$AUTH" in
            trusted-publishing)
              [ "$exists" = true ] || { echo "$PACKAGE does not exist yet, and npm cannot configure trusted publishing for it: use auth=bootstrap-token once (release/npm-publishing.md)"; exit 1; } ;;
            bootstrap-token)
              [ "$exists" = false ] || { echo "$PACKAGE already exists: publish with trusted-publishing, then revoke the bootstrap token and delete NPM_TOKEN"; exit 1; }
              [ "$HAVE_TOKEN" = true ] || { echo "the npm-publish environment has no NPM_TOKEN secret"; exit 1; } ;;
          esac
          echo "package exists: $exists; auth: $AUTH"
      - name: npm publish
        env:
          # Set only for the one-time bootstrap. With trusted publishing no
          # token is passed at all, so a leftover secret is never used.
          NODE_AUTH_TOKEN: ${{ inputs.auth == 'bootstrap-token' && secrets.NPM_TOKEN || '' }}
        run: |
          set -eu
          flags="--tag $TAG --access public --provenance"
          [ "$DRY_RUN" = true ] && flags="$flags --dry-run"
          # shellcheck disable=SC2086
          # "./": without it npm reads "npm/<file>" as the GitHub repository npm/<file>.
          npm publish "./npm/nextrs-cli-$VERSION.tgz" $flags
      - name: Registry integrity, dist-tags and provenance
        if: ${{ !inputs.dry_run }}
        run: |
          set -eu
          want=$(node -p "require('./npm/nextrs-cli-$VERSION.npm.json').integrity")
          got=""
          for _ in $(seq 1 30); do
            got=$(npm view "$PACKAGE@$VERSION" dist.integrity 2> /dev/null || true)
            [ -n "$got" ] && break
            sleep 10
          done
          [ "$got" = "$want" ] || { echo "the registry's integrity '$got' is not the packed '$want'"; exit 1; }
          npm view "$PACKAGE" dist-tags --json | tee dist-tags.json
          [ "$(node -p "require('./dist-tags.json')['$TAG']")" = "$VERSION" ] || { echo "dist-tag $TAG is not $VERSION"; exit 1; }
          latest=$(node -p "require('./dist-tags.json').latest || ''")
          case "$latest" in
            *-*) echo "::warning::latest is $latest, a prerelease. The registry may set latest at a package's first publish; it moves at the first stable release." ;;
          esac
          npm view "$PACKAGE@$VERSION" dist.attestations --json | tee attestations.json
          node -e 'const a = require("./attestations.json"); if (!a || !a.provenance) { console.error("no provenance attestation"); process.exit(1); }'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-publish-${{ inputs.version }}${{ inputs.dry_run && '-dry-run' || '' }}
          path: |
            npm/*.tgz.sha256
            npm/*.npm.json
            npm/*.verify.json
            dist-tags.json
            attestations.json
          if-no-files-found: ignore
