name: Release build

# Builds, tests and packages a release candidate or release. It publishes
# nothing: no tag is pushed, no GitHub release is created, nothing goes to
# crates.io or a container registry. The archive, its checksum and manifest
# are uploaded as workflow artifacts, to verify the pipeline and clean
# installs. Builds are not bit-for-bit reproducible, so the archive that is
# published is the one whose binary passed the release gates, packaged by a
# maintainer with authorization: see release/PUBLISHING.md.
#
# Run it from the Actions tab (workflow_dispatch) with the version, e.g.
# 0.1.0-rc.1, on the commit to be tagged; or it runs when a maintainer
# pushes a v* tag. It also runs on pull requests that change the release
# tooling, packaging the workspace version, so the pipeline (and the
# clean-install containers) are exercised before a release is cut.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, e.g. 0.1.0-rc.1 (must equal the Cargo workspace version)"
        required: true
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "release/**"
      - "scripts/package-release.sh"
      - "scripts/release-smoke.sh"
      - "scripts/clean-install-*.sh"
      - "scripts/runtime-file-audit.sh"
      - "scripts/third-party-licenses.mjs"
      - "LICENSE-*"
      - "packages/cli/**"
      - "scripts/package-npm.sh"
      - "scripts/verify-npm-package.sh"
      - "scripts/npm-*.sh"
      - "tests/npm/**"
      - "examples/docker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/nextrs-runtime/js/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"
  # The CI toolchain; the release binary is built with the same one.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  version:
    name: version consistency
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag, input and Cargo workspace agree
        env:
          # Through the environment, never interpolated into the script.
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          ws=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          case "$EVENT" in
            push) v="${GITHUB_REF_NAME#v}" ;;
            workflow_dispatch) v="$INPUT_VERSION" ;;
            *) v="$ws" ;;
          esac
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' || { echo "not a release version: $v"; exit 1; }
          [ "$ws" = "$v" ] || { echo "Cargo workspace version is $ws, release is $v"; exit 1; }
          for crate in nextrs-adapter nextrs-cli nextrs-image nextrs-runtime nextrs-server; do
            lv=$(awk -v n="$crate" '$0=="name = \""n"\"" {getline; gsub(/version = |"/,""); print; exit}' Cargo.lock)
            [ "$lv" = "$v" ] || { echo "Cargo.lock: $crate is $lv"; exit 1; }
          done
          [ -f "release/v$v-release-notes.md" ] || { echo "missing release/v$v-release-notes.md"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  test:
    name: fmt, clippy, tests, audit
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo audit

  build:
    name: build and package (linux x86_64)
    needs: version
    # The oldest supported runner: the binary's glibc floor follows it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      # No cache: a release is built from a clean target directory.
      - name: Build (dist profile, portable, no target-cpu)
        run: cargo build --locked --profile dist -p nextrs-cli
      - name: Package
        run: scripts/package-release.sh --binary target/dist/nextrs --version "${{ needs.version.outputs.version }}" --out dist --toolchain "${{ env.RUST_TOOLCHAIN }}"
      # The build machine still has the Cargo registry and this checkout, so
      # every read below would succeed: the audit fails on any attempt.
      - name: Runtime file audit (no build-machine path is touched at run time)
        run: |
          sudo apt-get install -y -qq strace > /dev/null
          scripts/runtime-file-audit.sh --archive "dist/nextrs-v${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" \
            --app fixtures/next-app --isolates 2 --out audit
      - name: Clean-install bundle (official next build outputs; Node.js builds them, nothing serves them with it)
        run: |
          scripts/clean-install-bundle.sh --archive "dist/nextrs-v${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" --out bundle
          tar -czf clean-install-bundle.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: nextrs-v${{ needs.version.outputs.version }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: clean-install-bundle
          path: clean-install-bundle.tar.gz
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-file-audit
          path: |
            audit/summary.json
            audit/paths.txt
            audit/violations.txt
            audit/server.log
          if-no-files-found: ignore

  compat:
    name: compatibility suites on the release binary (pinned, ${{ matrix.isolates }} isolate(s))
    needs: [version, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        isolates: [1, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - uses: actions/download-artifact@v4
        with:
          name: nextrs-v${{ needs.version.outputs.version }}-linux-x86_64
          path: dist
      - name: Verify and unpack the release archive
        run: |
          cd dist && sha256sum -c *.tar.gz.sha256 && tar -xzf *.tar.gz
          echo "NEXTRS_BIN=$PWD/nextrs-v${{ needs.version.outputs.version }}-linux-x86_64/nextrs" >> "$GITHUB_ENV"
      - name: HTTP comparison against next start
        run: scripts/compat-suite.sh --isolates ${{ matrix.isolates }} --out compat-out --cache-components --proxy --images --pages --adapter
      - name: Real-world proxy applications against next start
        run: scripts/realworld-suite.sh --isolates ${{ matrix.isolates }} --out realworld-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-compat-i${{ matrix.isolates }}
          path: |
            compat-out
            realworld-out
          if-no-files-found: ignore

  clean-install:
    name: clean install on ${{ matrix.image }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    # No checkout: the runner gets only the bundle (the archive, prebuilt
    # applications and the curl-only test scripts). The test runs in a
    # fresh container of a bare distribution image whose only mounts are
    # that bundle (read-only) and an empty results directory, so no Rust,
    # no Node.js, no Cargo registry and no source tree is visible inside.
    # Only curl is installed, without recommended packages (so no
    # ca-certificates): TLS must work from NextRS's bundled roots. The
    # server runs as an unprivileged user.
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12-slim"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clean-install-bundle
          path: .
      - name: Unpack the bundle
        run: tar -xzf clean-install-bundle.tar.gz && rm clean-install-bundle.tar.gz && ls bundle
      - name: Install, isolation and feature checks in a fresh container
        run: bash bundle/scripts/clean-install-containers.sh --engine docker --bundle bundle --results results --image "${{ matrix.image }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-install-${{ strategy.job-index }}
          path: results
          if-no-files-found: ignore

  # ------------------------------------------------------------------ npm
  # The npm package is a second channel for the same binary: it is packed
  # from the archive built above (never from a separate build), verified
  # byte for byte against it, and installed with npm and pnpm in clean
  # containers. Nothing is published: see npm-publish.yml.
  npm-package:
    name: npm package (pack, verify, negative tests)
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - uses: actions/download-artifact@v4
        with:
          name: nextrs-v${{ needs.version.outputs.version }}-linux-x86_64
          path: dist
      - name: Pack from the release archive and verify against it
        run: scripts/package-npm.sh --archive "dist/nextrs-v${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" --out dist/npm
      - name: Packing is deterministic
        run: |
          scripts/package-npm.sh --archive "dist/nextrs-v${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" --out repack > /dev/null
          cmp dist/npm/*.tgz repack/*.tgz && echo "identical: $(cat dist/npm/*.tgz.sha256)"
      - name: Refusals (version mismatch, checksums, withdrawn build, scripts, permissions, extra files)
        run: tests/npm/packaging-negative.sh --archive "dist/nextrs-v${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" --tarball dist/npm/nextrs-sh-cli-${{ needs.version.outputs.version }}.tgz --json dist/npm/packaging-negative.json
      - uses: actions/upload-artifact@v4
        with:
          name: nextrs-sh-cli-${{ needs.version.outputs.version }}-npm
          path: |
            dist/npm/*.tgz
            dist/npm/*.tgz.sha256
            dist/npm/*.npm.json
            dist/npm/*.verify.json
            dist/npm/packaging-negative.json
          if-no-files-found: error

  npm-install:
    name: npm and pnpm install on ${{ matrix.image }}
    needs: [version, build, npm-package]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12-slim"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - uses: actions/download-artifact@v4
        with:
          name: nextrs-v${{ needs.version.outputs.version }}-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: nextrs-sh-cli-${{ needs.version.outputs.version }}-npm
          path: dist/npm
      # The containers get only the bundle: the tarball, Node.js and pnpm
      # (checksum-verified), and the application source. Its dependencies are
      # installed with the network; the NextRS package, next build and the
      # server run with --network none. No Rust is visible anywhere.
      - name: Bundle
        run: scripts/npm-install-bundle.sh --tarball dist/npm/nextrs-sh-cli-${{ needs.version.outputs.version }}.tgz --manifest "dist/nextrs-v${{ needs.version.outputs.version }}-linux-x86_64.manifest.json" --out bundle --node-version 22.20.0
      - name: Install, build, serve, signals, failure cases
        run: scripts/npm-install-containers.sh --engine docker --bundle bundle --results results --image "${{ matrix.image }}" --no-unsupported
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-${{ strategy.job-index }}
          path: results
          if-no-files-found: ignore

  npm-unsupported:
    name: npm on unsupported platforms (glibc 2.31, musl)
    needs: [version, build, npm-package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - uses: actions/download-artifact@v4
        with:
          name: nextrs-v${{ needs.version.outputs.version }}-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: nextrs-sh-cli-${{ needs.version.outputs.version }}-npm
          path: dist/npm
      - name: Bundle
        run: scripts/npm-install-bundle.sh --tarball dist/npm/nextrs-sh-cli-${{ needs.version.outputs.version }}.tgz --manifest "dist/nextrs-v${{ needs.version.outputs.version }}-linux-x86_64.manifest.json" --out bundle --node-version 22.20.0
      - name: Ubuntu 20.04 (glibc 2.31) and Alpine (musl) refuse clearly
        run: scripts/npm-install-containers.sh --engine docker --bundle bundle --results results --only-unsupported
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-unsupported
          path: results
          if-no-files-found: ignore

  docker-example:
    name: documented Dockerfile (examples/docker)
    needs: [version, build, npm-package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - uses: actions/download-artifact@v4
        with:
          name: nextrs-v${{ needs.version.outputs.version }}-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: nextrs-sh-cli-${{ needs.version.outputs.version }}-npm
          path: dist/npm
      - name: Build the image from the npm package, run it without Node.js, stop it
        run: |
          sha=$(node -p "require('./dist/nextrs-v${{ needs.version.outputs.version }}-linux-x86_64.manifest.json').binary_sha256")
          scripts/npm-docker-example.sh --engine docker --tarball dist/npm/nextrs-sh-cli-${{ needs.version.outputs.version }}.tgz --expect-sha256 "$sha" --out docker-example
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-example
          path: |
            docker-example/docker-example.json
            docker-example/Dockerfile.diff
            docker-example/inventory.txt
            docker-example/server.log
            docker-example/build.log
          if-no-files-found: ignore
