name: Release

# Push a tag on main and this publishes the release:
#
#   scripts/bump-version.sh 0.1.0      # pull request, merge into main
#   git tag v0.1.0 origin/main && git push origin v0.1.0
#
# check -> test -> build -> publish:
#   - the tag must be on main and equal the version in Cargo.toml,
#     Cargo.lock and packages/cli/package.json;
#   - fmt, clippy, tests and cargo audit;
#   - build the binary, package the archive and the npm tarball (both are
#     verified by their scripts);
#   - create the GitHub release with the archive, and publish @nextrs/cli
#     to npm. The version decides the channel (scripts/publish-release.sh):
#       x.y.z                        GitHub latest release, npm `latest`
#       x.y.z-alpha.N, -beta.N, -rc.N  GitHub prerelease, npm `next`
#     Before publishing, the downloaded artifacts are checked against their
#     .sha256 files and manifests (version, channel, same archive).
#
# Release notes are optional: release/v<version>-release-notes.md when it
# exists, otherwise GitHub generates them from the merged pull requests.
#
# Publishing uses the `npm-publish` environment and its NPM_TOKEN secret.
#
# On a pull request that changes the release tooling, it runs everything
# except publish.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package-release.sh"
      - "scripts/package-npm.sh"
      - "scripts/verify-npm-package.sh"
      - "scripts/publish-release.sh"
      - "scripts/test-publish-release.sh"
      - "packages/cli/**"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The CI toolchain; the release binary is built with the same one.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  check:
    name: version and tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          ws=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          if [ "$EVENT" = push ]; then
            v="${GITHUB_REF_NAME#v}"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
          else
            v="$ws"
          fi
          # Refuses anything but x.y.z and x.y.z-(alpha|beta|rc).N.
          channel=$(scripts/publish-release.sh channel "$v")
          [ "$ws" = "$v" ] || { echo "Cargo.toml is $ws, tag is $v: run scripts/bump-version.sh $v first"; exit 1; }
          for crate in nextrs-adapter nextrs-cli nextrs-image nextrs-runtime nextrs-server; do
            lv=$(awk -v n="$crate" '$0=="name = \""n"\"" {getline; gsub(/version = |"/,""); print; exit}' Cargo.lock)
            [ "$lv" = "$v" ] || { echo "Cargo.lock: $crate is $lv, tag is $v"; exit 1; }
          done
          pv=$(node -p "require('./packages/cli/package.json').version")
          [ "$pv" = "$v" ] || { echo "packages/cli/package.json is $pv, tag is $v"; exit 1; }
          echo "version $v"; echo "$channel"
          { echo "version=$v"; echo "$channel"; } >> "$GITHUB_OUTPUT"
      - name: Publish script tests (channel, commands, artifact checks)
        run: scripts/test-publish-release.sh

  test:
    name: fmt, clippy, tests, audit
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo audit

  build:
    name: build and package (linux x86_64)
    needs: check
    # The oldest supported runner: the binary's glibc floor follows it.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      # No cache: a release is built from a clean target directory.
      - name: Build (dist profile)
        run: cargo build --locked --profile dist -p nextrs-cli
      - name: Package the archive
        run: scripts/package-release.sh --binary target/dist/nextrs --version "$VERSION" --out dist --toolchain "$RUST_TOOLCHAIN"
      - name: Pack the npm tarball from the archive
        run: scripts/package-npm.sh --archive "dist/nextrs-v$VERSION-linux-x86_64.tar.gz" --out dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.json
            dist/npm/*.tgz
            dist/npm/*.tgz.sha256
            dist/npm/*.npm.json
          if-no-files-found: error
      # What the publish job will run, on these artifacts (never publishes).
      - name: Publish commands (dry run)
        run: |
          scripts/publish-release.sh github "$VERSION" --dry-run
          scripts/publish-release.sh npm "$VERSION" --dry-run

  publish:
    name: GitHub release and npm
    needs: [check, test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
      - name: Verify the artifacts
        run: scripts/publish-release.sh verify "$VERSION"
      - name: GitHub release (prerelease=${{ needs.check.outputs.prerelease }})
        run: scripts/publish-release.sh github "$VERSION"
      - name: npm publish (${{ needs.check.outputs.npm_tag }})
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: scripts/publish-release.sh npm "$VERSION"
